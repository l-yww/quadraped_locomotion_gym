# ======= torque-velocity 约束 (对齐训练侧 quadruped_wtw_him_arm_fix_config.py) =======
# 与 LeggedRobot._compute_torques 的平行四边形包络逐行一致, sim2real 必须对齐否则落脚重。
# 参数取 wtw 训练侧 (hip 220Nm / calf 330Nm), 不是 amp 的 200/330。
torque_vel_limits:
  hip_thigh:
    indices: [0, 1, 3, 4, 6, 7, 9, 10]   # FL/FR/RL/RR 的 hip+thigh
    max_vel: 20.0      # rad/s, 超过此值力矩限 0
    vel_1: 7.28        # rad/s, 此值以下力矩限 max_torque, 以上线性递减
    max_torque: 200.0  # Nm
    directional_brake: true
  calf:
    indices: [2, 5, 8, 11]              # FL/FR/RL/RR 的 calf
    max_vel: 12.0
    vel_1: 6.6
    max_torque: 330.0
    directional_brake: true
  # 顶层静态 clip (兜底, 与分组 max_torque 对齐)
  top_clip: [200.0, 200.0, 330.0,
             200.0, 200.0, 330.0,
             200.0, 200.0, 330.0,
             200.0, 200.0, 330.0]
