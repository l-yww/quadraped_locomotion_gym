# HIM (History-based Imitation and Modeling) model config for quadruped_arm_him (3D cmd)
# obs 维度由 enable_gait_clock 决定(必须与训练 env 一致):
# enable_gait_clock=True : cmd3+q12+dq12+act12+ang3+grav3+gait1+clock4 = 50 → input 30*50=1500
# enable_gait_clock=False: cmd3+q12+dq12+act12+ang3+grav3              = 45 → input 30*45=1350
# deploy 脚本按 enable_gait_clock 自动兼容两种模型

frame_stack: 30

# 步态时钟开关：必须与训练 env 的 observe_timing_parameter/observe_clock_inputs 一致
# True=50维(有时钟, 对应 enable_gait_clock=True 训练的模型)
# False=45维(无时钟, 对应 enable_gait_clock=False 训练的模型, 如当前 amp 模型)
enable_gait_clock: False

# 步态时钟参数（仅 enable_gait_clock=true 时生效；与 quadruped_arm_him env 固定常量一致）
gait_freq: 2.0        # 步频 Hz
gait_phase: 0.5       # trot 对角同相
gait_offset: 0.0
gait_bound: 0.0
gait_duration: 0.5    # 占空比 50%
zero_cmd_thresh: 0.1  # 原地检测阈值: ‖cmd[:2]‖ 与 |cmd[2]| 均小于此值时步态停转

