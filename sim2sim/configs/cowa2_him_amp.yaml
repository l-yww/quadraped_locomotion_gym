  "FR_calf_joint",
  "RR_calf_joint"
]

# ===== torque-vel 约束 (对齐训练父类 LeggedRobot._compute_torques) =====
torque_vel_limits:
  hip_thigh:
    indices: [0, 1, 3, 4, 6, 7, 9, 10]   # FL/FR/RL/RR 的 hip+thigh
    max_vel: 21.0     # rad/s, 超过此值加速力矩限 0
    vel_1: 7.28       # rad/s, 此值以下力矩限 max_torque, 以上线性递减
    max_torque: 200.0 # Nm
  calf:
    indices: [2, 5, 8, 11]                # FL/FR/RL/RR 的 calf
    max_vel: 13.0
    vel_1: 6.6
    max_torque: 330.0
    directional_brake: true
  # 顶层静态 clip (兜底, 与分组 max_torque 对齐)
  top_clip: [ 200.0, 200.0, 330.0, 
              200.0, 200.0, 330.0, 
              200.0, 200.0, 330.0, 
              200.0, 200.0, 330.0 ]
